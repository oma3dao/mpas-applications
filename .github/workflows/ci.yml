name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    outputs:
      applications: ${{ steps.bridges.outputs.applications }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Standard library only — no install step needed.
      # Fails on: plugin structure, operation key vs executionPayloadSchema
      # name.const, governed operations missing from the upstream snapshot, a
      # stale plugin.artifactDid (the Credential Adapter rejects a mismatch at
      # startup), classification coverage, unreviewed 'name-heuristic'
      # rationales, unrecognised pass-through reason tags, author-local
      # absolute paths in harness-config.json or metadata.json, and floating
      # npx package specs (an upstream nobody can relaunch identically is a
      # classification nobody can reproduce). Generated bridges must also use
      # the adaptive selector while preserving Coordination signing and the
      # Credential Adapter-only execution boundary.
      # Warns without failing on classification/plugin impact drift.
      - name: Validate application artifacts
        run: python3 scripts/validate-applications.py --github

      - name: Test artifact validator helpers
        run: python3 scripts/test_validate_applications.py

      - name: Test bridge discovery
        run: python3 scripts/test_discover_bridges.py

      - name: Discover bridges
        id: bridges
        run: |
          applications=$(python3 scripts/discover-bridges.py)
          echo "applications=$applications" >> "$GITHUB_OUTPUT"

  bridge-protocols:
    needs: ci
    name: bridge-protocols (${{ matrix.application }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        application: ${{ fromJSON(needs.ci.outputs.applications) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: applications/${{ matrix.application }}/bridge/package-lock.json

      - name: Install
        run: npm ci --prefix applications/${{ matrix.application }}/bridge

      - name: Build
        run: npm run --prefix applications/${{ matrix.application }}/bridge build

      - name: Probe Tasks and conventional MCP surfaces
        run: node scripts/probe-bridge-protocols.mjs applications/${{ matrix.application }}
