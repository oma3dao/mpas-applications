name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Standard library only — no install step needed.
      # Fails on: plugin structure, operation key vs executionPayloadSchema
      # name.const, governed operations missing from the upstream snapshot, a
      # stale plugin.artifactDid (the Credential Adapter rejects a mismatch at
      # startup), classification coverage, unreviewed 'name-heuristic'
      # rationales, unrecognised pass-through reason tags, and author-local
      # absolute paths in harness-config.json or metadata.json (an upstream
      # nobody can launch is a classification nobody can reproduce).
      # Warns without failing on classification/plugin impact drift.
      - name: Validate application artifacts
        run: python3 scripts/validate-applications.py --github

  # Smoke-build one bridge; not required by the critical ruleset.
  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/github/bridge

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: applications/github/bridge/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
